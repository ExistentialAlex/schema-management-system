resource_types:
  - name: slack-alert
    type: registry-image
    source:
      repository: europe-west1-docker.pkg.dev/uk-cti-adtech-platform-prod/adtech-platform-shared/arbourd/concourse-slack-alert-resource
      tag: v0.16.2
      username: _json_key
      password: |
        ((schema-manager-keyfile.keyfile))

resources:
  - name: schema-manager-server
    type: git
    icon: github
    webhook_token: ((schema-manager-server-webhook-token))
    source:
      uri: https://github.com/sky-uk/schema-manager.git
      branch: main
      fetch_tags: true
      username: svc-adtech-cicd-bot
      password: ((github_pat))
      paths:
        - server
        - shared
        - package.json
        - Dockerfile
        - docker-compose.yaml
      ignore_paths:
        - ./deployment/pipelines/pipeline_generator.yaml
  - name: slack-ci-cd
    type: slack-alert
    source:
      url: https://hooks.slack.com/services/((slack_webhook))

build_log_retention: &build_log_retention
  builds: 100
  minimum_succeeded_builds: 3

_slack_success_update: &slack_success_update
  put: notify-slack-success
  resource: slack-ci-cd
  params:
    alert_type: success

_slack_failure_update: &slack_failure_update
  put: notify-slack-failure
  resource: slack-ci-cd
  params:
    alert_type: failed

jobs:
  - name: deploy-test
    serial: true
    build_log_retention: *build_log_retention
    on_failure: *slack_failure_update
    on_abort: *slack_failure_update
    on_error: *slack_failure_update
    on_success: *slack_success_update
    plan:
      - get: schema-manager-server
        trigger: true
      - task: tag
        file: schema-manager-server/server/ci/pipelines/tasks/tag.yaml
        vars:
          repo_name: schema-manager-server
          pat_token: ((github_pat))
      - load_var: tag
        file: schema-manager-server/tag.txt
        reveal: true
      - put: schema-manager-server
        params:
          repository: schema-manager-server
      - task: set-build-version
        file: schema-manager-server/server/ci/pipelines/tasks/set-build-version.yaml
        vars:
          repo_name: schema-manager-server
          version: ((.:tag))
      - task: docker-build
        privileged: true
        file: schema-manager-server/server/ci/pipelines/tasks/build-image.yaml
        vars:
          repo_name: schema-manager-server
          context: schema-manager-server
          target: server
      - task: docker-push
        file: schema-manager-server/server/ci/pipelines/tasks/push-image.yaml
        vars:
          repo_name: schema-manager-server
          google_json_credentials: ((schema-manager-keyfile.keyfile))
          target_image: europe-west1-docker.pkg.dev/uk-cti-adtech-platform-test/schema-manager/schema-manager-server
      - task: deploy-to-test
        privileged: true
        file: schema-manager-server/server/ci/pipelines/tasks/run-make.yaml
        vars:
          repo_name: schema-manager-server
          gcp_sa_name: concourse-ui-bff@grp-cti-adtech-adf-test.iam.gserviceaccount.com
          git_tag: ((.:tag))
          target_env: test
          make_target: deploy-server
          gcp_sa_key_secret_path: ((schema-manager-keyfile.keyfile))
          github_pat_token_secret_name: ((github_pat))
      - task: stubbed-promote-to-stage
        privileged: true
        file: schema-manager-server/server/ci/pipelines/tasks/run-tests.yaml
        vars:
          repo_name: schema-manager-server
          gcp_sa_name: concourse-ui-bff@grp-cti-adtech-adf-test.iam.gserviceaccount.com
          git_tag: ((.:tag))
          target_env: test
          make_target: mock-command
          gcp_sa_key_secret_path: ((schema-manager-keyfile.keyfile))
          github_pat_token_secret_name: ((github_pat))
