  name: schema-manager-server
spec:
  template:
    metadata:
      annotations:
    spec:
      containers:
        - name: schema-manager-server
          image: europe-west1-docker.pkg.dev/uk-cti-adtech-platform-test/schema-manager/schema-manager-server:${GIT_TAG}
          env:
            - name: VITE_UI_URL
              value: https://schema-manager-app.internal.test.adtechplatform.sky.com
